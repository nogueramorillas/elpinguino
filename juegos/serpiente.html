<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b2410">
<title>Serpiente · 60 niveles</title>
<style>
  :root { --lcd:#9bbc0f; --lcd2:#8bac0f; --ink:#0f380f; --mid:#306230; --case:#1b2410; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--case); color:var(--lcd); font-family:"Courier New",monospace; overscroll-behavior:none; touch-action:none; user-select:none; -webkit-user-select:none; }
  #app { max-width:520px; margin:0 auto; padding:10px 16px; display:flex; flex-direction:column; align-items:center; gap:8px; min-height:100%; }
  #screen { position:relative; width:100%; background:var(--lcd); border:6px solid #0c1608; border-radius:10px; box-shadow:inset 0 0 18px rgba(15,56,15,.45); }
  #hud { display:flex; justify-content:space-between; color:var(--ink); font-weight:bold; font-size:15px; padding:6px 8px 2px; }
  canvas { display:block; width:100%; height:auto; image-rendering:pixelated; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:safe center; text-align:center; background:rgba(155,188,15,.94); color:var(--ink); padding:16px; border-radius:4px; overflow:auto; }
  #overlay.hidden { display:none; }
  #overlay h1 { margin:0 0 6px; font-size:30px; letter-spacing:3px; }
  #overlay h2 { margin:0 0 6px; font-size:22px; }
  #overlay p { margin:4px 0; font-size:14px; }
  .btn { font:inherit; font-weight:bold; font-size:16px; background:var(--ink); color:var(--lcd); border:none; border-radius:6px; padding:10px 18px; margin:5px; cursor:pointer; }
  .btn.alt { background:var(--mid); }
  #levels { display:grid; grid-template-columns:repeat(10,1fr); gap:3px; margin:6px 0; width:100%; }
  #levels button { font:inherit; font-weight:bold; font-size:12px; padding:5px 0; border:2px solid var(--ink); background:var(--lcd2); color:var(--ink); border-radius:4px; cursor:pointer; }
  #levels button.done { background:var(--ink); color:var(--lcd); }
  #levels button:disabled { opacity:.3; cursor:default; }
  #pad { display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(3,64px); gap:6px; margin-top:4px; }
  #pad button { font-size:26px; background:#2c3a1c; color:var(--lcd); border:none; border-radius:12px; box-shadow:0 4px 0 #0c1608; }
  #pad button:active { transform:translateY(3px); box-shadow:0 1px 0 #0c1608; }
  #pad .c { font-size:14px; font-weight:bold; }
  #help { font-size:12px; color:#7d9a2a; text-align:center; }
</style>
</head>
<body>
<div id="app">
  <div id="screen">
    <div id="hud"><span id="hLevel">NIVEL 1</span><span id="hFood">0/5</span><span id="hScore">0000</span></div>
    <canvas id="cv" width="400" height="400"></canvas>
    <div id="overlay"></div>
  </div>
  <div id="pad">
    <span></span><button data-d="up">▲</button><span></span>
    <button data-d="left">◀</button><button class="c" data-d="pause">II</button><button data-d="right">▶</button>
    <span></span><button data-d="down">▼</button><span></span>
  </div>
  <div id="help">Flechas / WASD / deslizar el dedo · Espacio o P = pausa · Funciona sin conexión</div>
</div>
<script>
(() => {
  const N = 20, TOTAL = 60;
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const CELL = cv.width / N;
  const ov = document.getElementById('overlay');
  const $ = id => document.getElementById(id);
  const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
  const COL = { bg:'#9bbc0f', ink:'#0f380f', mid:'#306230', light:'#8bac0f' };

  // ---------- Guardado (localStorage, opcional) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('serp_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('serp_' + k, JSON.stringify(v)); } catch (e) {} }
  };
  let unlocked = store.get('unlocked', 1), best = store.get('best', {}), totalBest = store.get('total', 0);

  // ---------- Niveles ----------
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const hline = (w, y, x0, x1) => { for (let x = x0; x <= x1; x++) w.add(x + ',' + y); };
  const vline = (w, x, y0, y1) => { for (let y = y0; y <= y1; y++) w.add(x + ',' + y); };
  const border = w => { hline(w,0,0,N-1); hline(w,N-1,0,N-1); vline(w,0,0,N-1); vline(w,N-1,0,N-1); };
  const gapBorder = w => { border(w); [9,10].forEach(i => { w.delete(i+',0'); w.delete(i+','+(N-1)); w.delete('0,'+i); w.delete((N-1)+','+i); }); };

  const PATTERNS = [
    { name:'Campo abierto', f:w=>{} },
    { name:'La caja', f:w=>border(w) },
    { name:'Puertas', f:w=>gapBorder(w) },
    { name:'Barras', f:w=>{ hline(w,5,4,15); hline(w,14,4,15); } },
    { name:'Esquinas', f:w=>{ [[2,2,1,1],[17,2,-1,1],[2,17,1,-1],[17,17,-1,-1]].forEach(([x,y,dx,dy])=>{ for(let i=0;i<5;i++){ w.add((x+i*dx)+','+y); w.add(x+','+(y+i*dy)); } }); } },
    { name:'La cruz', f:w=>{ vline(w,10,2,7); vline(w,10,12,17); hline(w,10,12,17); hline(w,10,2,7); } },
    { name:'Pilares', f:w=>{ for(let x=3;x<N-2;x+=4) for(let y=3;y<N-2;y+=4) { w.add(x+','+y); w.add((x+1)+','+y); w.add(x+','+(y+1)); w.add((x+1)+','+(y+1)); } } },
    { name:'Columnas', f:w=>{ [4,8,12,16].forEach((x,i)=>{ if(i%2) vline(w,x,0,13); else vline(w,x,6,N-1); }); } },
    { name:'Fortaleza', f:w=>{ hline(w,5,5,14); hline(w,14,5,14); vline(w,5,5,14); vline(w,14,5,14); ['9,5','10,5','9,14','10,14','5,9','5,10','14,9','14,10'].forEach(k=>w.delete(k)); } },
    { name:'Zigzag', f:w=>{ for(let y=3;y<N-2;y+=4) { const left = (y/4|0)%2===0; hline(w,y,left?0:5,left?14:N-1); } } },
    { name:'Espiral', f:w=>{ hline(w,2,2,17); vline(w,17,2,17); hline(w,17,4,17); vline(w,4,6,17); hline(w,6,4,13); vline(w,13,6,13); hline(w,13,8,13); } },
    { name:'Campo de minas', f:(w,r,lv)=>{ const n = 12 + lv; for(let i=0;i<n;i++) w.add((1+(r()*(N-2)|0))+','+(1+(r()*(N-2)|0))); } },
  ];

  function buildLevel(lv) {
    const P = PATTERNS.length, idx = (lv - 1) % P, tier = Math.floor((lv - 1) / P);
    const w = new Set(), r = rng(lv * 7919);
    PATTERNS[idx].f(w, r, lv);
    if (tier >= 1 && idx !== 1 && idx !== 2) (tier >= 3 ? border : gapBorder)(w);
    if (tier >= 2) { const extra = 4 + tier * 3; for (let i = 0; i < extra; i++) w.add((1+(r()*(N-2)|0))+','+(1+(r()*(N-2)|0))); }
    // Zona de salida siempre libre
    for (let x = 1; x <= 9; x++) for (let y = 9; y <= 11; y++) w.delete(x + ',' + y);
    const speed = Math.max(55, 170 - (lv - 1) * 2 - tier * 6);   // ms por paso
    const goal = Math.min(30, 5 + Math.floor(lv / 2));
    return { walls:w, speed, goal, name: PATTERNS[idx].name };
  }

  // ---------- Estado ----------
  let level = 1, L, snake, dir, queue, food, bonus, eaten, score, state = 'menu', timer = null, lastStep = 0, steps = 0;

  function startLevel(lv) {
    level = lv; L = buildLevel(lv);
    snake = [[5,10],[4,10],[3,10]]; dir = 'right'; queue = [];
    eaten = 0; score = 0; bonus = null; steps = 0;
    placeFood();
    state = 'ready';
    showOverlay(`<h2>NIVEL ${lv}</h2><p><b>${L.name}</b></p><p>Come ${L.goal} manzanas para pasar</p><p style="margin-top:10px">Pulsa una dirección para empezar</p>`);
    draw(); hud();
  }

  function freeCells() {
    // Celdas alcanzables desde la cabeza (evita comida inaccesible)
    const occ = new Set(snake.map(s => s[0] + ',' + s[1]));
    const seen = new Set(), q = [snake[0]], out = [];
    seen.add(snake[0][0] + ',' + snake[0][1]);
    while (q.length) {
      const [x, y] = q.shift();
      for (const [dx, dy] of Object.values(DIRS)) {
        const nx = (x + dx + N) % N, ny = (y + dy + N) % N, k = nx + ',' + ny;
        if (seen.has(k) || L.walls.has(k)) continue;
        seen.add(k); q.push([nx, ny]);
        if (!occ.has(k) && !(food && food[0] === nx && food[1] === ny)) out.push([nx, ny]);
      }
    }
    return out;
  }
  function placeFood() { food = null; const c = freeCells(); food = c.length ? c[Math.random() * c.length | 0] : null; }
  function placeBonus() { const c = freeCells(); if (c.length) bonus = { p: c[Math.random() * c.length | 0], t: 40 }; }

  function step() {
    if (queue.length) dir = queue.shift();
    const [dx, dy] = DIRS[dir];
    const head = [(snake[0][0] + dx + N) % N, (snake[0][1] + dy + N) % N];
    const k = head[0] + ',' + head[1];
    const grow = food && head[0] === food[0] && head[1] === food[1];
    const bodyToCheck = grow ? snake : snake.slice(0, -1);
    if (L.walls.has(k) || bodyToCheck.some(s => s[0] === head[0] && s[1] === head[1])) return die();
    snake.unshift(head);
    if (grow) {
      eaten++; score += 10 + level;
      if (navigator.vibrate) try { navigator.vibrate(15); } catch (e) {}
      if (eaten >= L.goal) return win();
      placeFood();
      if (!bonus && eaten % 4 === 0) placeBonus();
    } else snake.pop();
    if (bonus) {
      if (head[0] === bonus.p[0] && head[1] === bonus.p[1]) { score += 5 * bonus.t + level * 5; bonus = null; }
      else if (--bonus.t <= 0) bonus = null;
    }
    hud();
  }

  function die() {
    state = 'dead';
    if (navigator.vibrate) try { navigator.vibrate([60,40,60]); } catch (e) {}
    flash(3, () => showOverlay(`<h2>¡CHOCASTE!</h2><p>Nivel ${level} · ${eaten}/${L.goal} manzanas</p><p>Puntos: ${score}</p>
      <div><button class="btn" data-act="retry">Reintentar</button><button class="btn alt" data-act="menu">Menú</button></div>`));
  }

  function win() {
    state = 'won';
    const prev = best[level] || 0;
    if (score > prev) { best[level] = score; store.set('best', best); }
    totalBest = Object.values(best).reduce((a, b) => a + b, 0); store.set('total', totalBest);
    if (level >= unlocked && level < TOTAL) { unlocked = level + 1; store.set('unlocked', unlocked); }
    draw();
    if (level >= TOTAL) {
      showOverlay(`<h1>¡CAMPEÓN!</h1><p>Has superado los ${TOTAL} niveles.</p><p>Puntuación total: ${totalBest}</p><div><button class="btn" data-act="menu">Menú</button></div>`);
    } else {
      showOverlay(`<h2>¡NIVEL ${level} SUPERADO!</h2><p>Puntos: ${score}${score > prev && prev ? ' · ¡récord!' : ''}</p>
        <div><button class="btn" data-act="next">Siguiente ▶</button><button class="btn alt" data-act="menu">Menú</button></div>`);
    }
  }

  function flash(n, done) {
    let i = 0;
    const iv = setInterval(() => { (i % 2 ? draw() : drawDead()); if (++i > n * 2) { clearInterval(iv); draw(); done(); } }, 120);
  }

  // ---------- Dibujo ----------
  function cell(x, y, c, pad = 1) { ctx.fillStyle = c; ctx.fillRect(x * CELL + pad, y * CELL + pad, CELL - pad * 2, CELL - pad * 2); }
  function draw() {
    ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = COL.light;
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) ctx.fillRect(x * CELL + CELL / 2 - 1, y * CELL + CELL / 2 - 1, 2, 2);
    if (!L) return;
    L.walls.forEach(k => { const [x, y] = k.split(',').map(Number); cell(x, y, COL.mid, 0); cell(x, y, COL.ink, 3); });
    if (food) { const cx = food[0] * CELL + CELL / 2, cy = food[1] * CELL + CELL / 2; ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc(cx, cy + 1, CELL / 2 - 3, 0, 7); ctx.fill(); ctx.fillRect(cx - 1, cy - CELL / 2 + 1, 2, 5); }
    if (bonus && (bonus.t > 10 || steps % 2)) { const [x, y] = bonus.p; ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.moveTo(x*CELL+CELL/2, y*CELL+2); ctx.lineTo(x*CELL+CELL-2, y*CELL+CELL/2); ctx.lineTo(x*CELL+CELL/2, y*CELL+CELL-2); ctx.lineTo(x*CELL+2, y*CELL+CELL/2); ctx.fill(); }
    snake.forEach((s, i) => cell(s[0], s[1], COL.ink, i === 0 ? 0 : 2));
    const [hx, hy] = snake[0], [dx, dy] = DIRS[dir];
    ctx.fillStyle = COL.bg;
    const ex = hx * CELL + CELL / 2 + dx * 4, ey = hy * CELL + CELL / 2 + dy * 4;
    ctx.fillRect(ex - 1 - dy * 4, ey - 1 - dx * 4, 3, 3); ctx.fillRect(ex - 1 + dy * 4, ey - 1 + dx * 4, 3, 3);
  }
  function drawDead() { draw(); ctx.fillStyle = 'rgba(15,56,15,.55)'; ctx.fillRect(0, 0, cv.width, cv.height); }
  function hud() {
    $('hLevel').textContent = 'NIVEL ' + level;
    $('hFood').textContent = '🍎 ' + (L ? eaten + '/' + L.goal : '');
    $('hScore').textContent = String(score || 0).padStart(4, '0');
  }

  // ---------- Menú ----------
  function showOverlay(html) { ov.innerHTML = html; ov.classList.remove('hidden'); }
  function hideOverlay() { ov.classList.add('hidden'); }
  function menu() {
    state = 'menu';
    let grid = '';
    for (let i = 1; i <= TOTAL; i++) grid += `<button data-lv="${i}" class="${best[i] ? 'done' : ''}" ${i > unlocked ? 'disabled' : ''}>${i}</button>`;
    showOverlay(`<h1>SERPIENTE</h1><p>${TOTAL} niveles · desbloqueados: ${unlocked}</p><p>Récord total: ${totalBest}</p>
      <div><button class="btn" data-lv="${unlocked}">Jugar nivel ${unlocked}</button></div>
      <div id="levels">${grid}</div>
      <p style="font-size:12px">◆ = bonus temporal · los bordes abiertos te teletransportan al otro lado</p>`);
  }
  ov.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.lv) return startLevel(+b.dataset.lv);
    const a = b.dataset.act;
    if (a === 'retry') startLevel(level);
    else if (a === 'next') startLevel(level + 1);
    else if (a === 'menu') menu();
    else if (a === 'resume') togglePause();
  });

  // ---------- Bucle ----------
  function loop(t) {
    requestAnimationFrame(loop);
    if (state !== 'play') { lastStep = t; return; }
    if (t - lastStep >= L.speed) { lastStep = t; steps++; step(); if (state === 'play') draw(); }
  }
  requestAnimationFrame(loop);

  // ---------- Controles ----------
  const OPP = { up:'down', down:'up', left:'right', right:'left' };
  function input(d) {
    if (d === 'pause') return togglePause();
    if (state === 'ready') {
      if (d === OPP[dir]) return; // no arrancar hacia atrás
      state = 'play'; hideOverlay(); queue = [d]; return;
    }
    if (state !== 'play') return;
    const last = queue.length ? queue[queue.length - 1] : dir;
    if (d === last || d === OPP[last] || queue.length >= 3) return;
    queue.push(d);
  }
  function togglePause() {
    if (state === 'play') { state = 'paused'; showOverlay(`<h2>PAUSA</h2><div><button class="btn" data-act="resume">Continuar</button><button class="btn alt" data-act="retry">Reiniciar</button><button class="btn alt" data-act="menu">Menú</button></div>`); }
    else if (state === 'paused') { state = 'play'; hideOverlay(); }
  }
  const KEYS = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right', ' ':'pause', p:'pause', P:'pause', Escape:'pause' };
  addEventListener('keydown', e => {
    if (e.key === 'Enter') { const b = ov.querySelector('.btn'); if (!ov.classList.contains('hidden') && b) { b.click(); e.preventDefault(); } return; }
    const d = KEYS[e.key]; if (!d) return;
    e.preventDefault(); input(d);
  });
  document.querySelectorAll('#pad button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); input(b.dataset.d); }));
  let sx = 0, sy = 0;
  cv.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive:true });
  cv.addEventListener('touchend', e => {
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    input(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }, { passive:true });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

  L = buildLevel(1); snake = [[5,10],[4,10],[3,10]]; dir = 'right'; eaten = 0; score = 0;
  draw(); hud(); menu();
})();
</script>
</body>
</html>
